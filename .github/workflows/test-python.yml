name: Target Tests

on:
  pull_request:

# cancel jobs if new commit pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}

jobs:
  test-qemu:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          cache: 'pip'
          python-version: "3.14"
      - name: Install dependencies
        run: |
          sudo apt update && sudo apt install -y libgcrypt20 libglib2.0-0 libpixman-1-0 libsdl2-2.0-0 libslirp0
          pip install -U pip
          export PIP_EXTRA_INDEX_URL="https://dl.espressif.com/pypi"
          pip install cryptography --prefer-binary
          pip install -r requirements.txt
          bash foreach.sh install
      - name: Download and install QEMU
        run: "echo skipped-for-baseline-isolation"
      - name: Save PR number
        run: "echo skipped-for-baseline-isolation"

      - name: Run QEMU tests
        run: "echo skipped-for-baseline-isolation"
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-qemu
          path: |
            pr_number.txt
            pytest-qemu.xml
            coverage-qemu.xml

  test-python:
    timeout-minutes: 40
    strategy:
      matrix:
        include:
          - python-version: "3.10"
            arch: "ARM64"
          - python-version: "3.14"
            arch: "X64"
      fail-fast: false
    runs-on:
      - self-hosted
      - multiboard
      - ${{ matrix.arch }}
    container:
      image: python:${{ matrix.python-version }}
      options: --privileged
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          apt update && apt install -y socat zip
          pip install -U pip
          export PIP_EXTRA_INDEX_URL="https://dl.espressif.com/pypi"
          pip install cryptography --prefer-binary
          pip install -r requirements.txt
          bash foreach.sh install
      - name: Check ports
        run: "echo skipped-for-baseline-isolation"

      - name: Run Tests with coverage
        run: "echo skipped-for-baseline-isolation"
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}-${{ matrix.arch }}
          path: |
            pytest-${{ matrix.python-version }}-${{ matrix.arch }}.xml
            coverage-${{ matrix.python-version }}-${{ matrix.arch }}.xml
